<head>

<meta property="og:description" content="2027년 1월 23일 토요일 오후 2시 · 부천 MJ컨벤션 3층 다이너스티홀">
<meta property="og:url" content="https://root4146-del.github.io/">
<meta property="og:image" content="https://root4146-del.github.io/assets/img/og.jpg">

<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="임형근 ♥ 신상은 결혼합니다">
<meta name="twitter:description" content="2027년 1월 23일 토요일 오후 2시 · 부천 MJ컨벤션 3층 다이너스티홀">
<meta name="twitter:image" content="https://root4146-del.github.io/assets/img/og.jpg">

<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/img/icon-180.png">
<link rel="manifest" href="site.webmanifest">

<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" as="style" crossorigin
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<!-- 배경음악: 드뷔시 「달빛」(1905, 피아노 솔로) · 퍼블릭 도메인
     출처 https://commons.wikimedia.org/wiki/File:Clair_de_Lune_by_Claude_Debussy_(1905,_piano_solo).opus -->
<audio id="bgm" src="assets/audio/bgm.mp3" loop preload="none"></audio>

<div class="bgm">
  <button type="button" class="bgm__btn" data-bgm aria-pressed="false" aria-label="배경음악 켜기">
    <svg class="bgm__on" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
    </svg>
    <svg class="bgm__off" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 18V6l10-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/>
      <path d="M3 3l18 18"/>
    </svg>
  </button>
</div>

<main class="invite">

  <!-- ══════════ 표지 ══════════ -->
  <section class="cover">
    <div class="ornament" aria-hidden="true">
      <svg viewBox="0 0 120 34" fill="none" stroke="currentColor" stroke-width="1.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 17c-7-9-14-13-20-10s-5 11 2 12 15-4 18-13c3 9 11 14 18 13s8-9 2-12-13 1-20 10z"/>
        <path d="M60 17c-6 6-13 9-19 8M60 17c6 6 13 9 19 8"/>
        <path d="M8 17h22M90 17h22"/>
      </svg>
    </div>
    <h1 class="cover__title">결혼합니다</h1>

    <figure class="cover__photo">
      <img src="assets/img/cover.jpg" alt="신랑 임형근, 신부 신상은" width="933" height="1400" fetchpriority="high">
    </figure>

    <p class="cover__names">
      <span class="tag">신랑</span><b>임형근</b>
      <span class="amp">&amp;</span>
      <span class="tag">신부</span><b>신상은</b>
    </p>
    <p class="cover__meta" data-cover-date></p>
    <p class="cover__meta">MJ컨벤션 3층 다이너스티홀</p>

    <div class="scroll-cue" aria-hidden="true"><span></span></div>
  </section>

  <!-- ══════════ 인사말 ══════════ -->
  <section class="section reveal" id="invitation">
    <p class="section__en">WEDDING DAY</p>
    <div class="rule" aria-hidden="true"></div>

    <p class="greeting" data-greeting></p>

    <div class="parents" data-parents></div>
  </section>

  <!-- ══════════ 예식 안내 + 캘린더 ══════════ -->
  <section class="section reveal" id="calendar">
    <p class="section__en">THE DAY</p>
    <div class="rule" aria-hidden="true"></div>

    <p class="daytitle" data-day-title></p>

    <div class="cal" data-calendar></div>

    <p class="dday" data-dday></p>
  </section>

  <!-- ══════════ 갤러리 ══════════ -->
  <section class="section section--wide reveal" id="gallery">
    <p class="section__en">GALLERY</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="section__hint">사진을 누르면 크게 볼 수 있어요</p>

    <div class="grid" data-gallery></div>
  </section>

  <!-- ══════════ 오시는 길 ══════════ -->
  <section class="section section--wide reveal" id="location">
    <p class="section__en">LOCATION</p>
    <div class="rule" aria-hidden="true"></div>

    <p class="place" data-place></p>
    <p class="addr" data-address></p>

    <div class="map" data-map></div>

    <div class="btnrow" data-map-links></div>

    <ul class="transport" data-transport></ul>
  </section>

  <!-- ══════════ 마음 전하실 곳 ══════════ -->
  <section class="section reveal" id="account">
    <p class="section__en">THANKS TO</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="section__lead">마음 전하실 곳</p>
    <p class="section__hint">참석이 어려우신 분들을 위해 기재하였습니다.<br>너그러운 마음으로 양해 부탁드립니다.</p>

    <div class="accounts" data-accounts></div>
  </section>

  <!-- ══════════ 공유 ══════════ -->
  <section class="section reveal" id="share">
    <div class="ornament ornament--sm" aria-hidden="true">
      <svg viewBox="0 0 120 34" fill="none" stroke="currentColor" stroke-width="1.1"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M60 17c-7-9-14-13-20-10s-5 11 2 12 15-4 18-13c3 9 11 14 18 13s8-9 2-12-13 1-20 10z"/>
        <path d="M60 17c-6 6-13 9-19 8M60 17c6 6 13 9 19 8"/>
        <path d="M8 17h22M90 17h22"/>
      </svg>
    </div>
    <p class="thanks">소중한 날, 귀한 걸음으로<br>축복해 주시면 감사하겠습니다.</p>

    <div class="btnrow">
      <button type="button" class="btn btn--fill" data-share>청첩장 공유하기</button>
      <button type="button" class="btn" data-copy-url>링크 복사하기</button>
    </div>
  </section>

  <footer class="foot">
    <p data-foot-date></p>
    <p>임형근 &amp; 신상은</p>
  </footer>

</main>

<!-- 갤러리 확대 보기 -->
<div class="lightbox" data-lightbox hidden tabindex="-1" role="dialog" aria-modal="true" aria-label="사진 크게 보기">
  <button type="button" class="lb__close" data-lb-close aria-label="닫기">&times;</button>
  <button type="button" class="lb__nav lb__nav--prev" data-lb-prev aria-label="이전 사진">&#8249;</button>
  <button type="button" class="lb__nav lb__nav--next" data-lb-next aria-label="다음 사진">&#8250;</button>
  <div class="lb__stage" data-lb-stage><img alt="" data-lb-img></div>
  <p class="lb__count" data-lb-count></p>
</div>

<div class="toast" data-toast hidden role="status" aria-live="polite"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/main.js"></script>
</body>
</html>
